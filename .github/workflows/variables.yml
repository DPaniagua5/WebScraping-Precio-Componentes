name: Revelar Todos Los Secretos

on:
  workflow_dispatch: # Se ejecuta manualmente desde Actions

jobs:
  reveal-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Imprimir variables codificadas en Base64
        env:
          # RAM Secrets
          R_Shop1: ${{ secrets.R_Shop1 }}
          R_Shop2: ${{ secrets.R_Shop2 }}
          R_Shop3: ${{ secrets.R_Shop3 }}
          R_Shop4: ${{ secrets.R_Shop4 }}
          R_Shop5: ${{ secrets.R_Shop5 }}
          R_Shop6: ${{ secrets.R_Shop6 }}
          R_Shop7: ${{ secrets.R_Shop7 }}
          R_Shop8: ${{ secrets.R_Shop8 }}
          R_Shop9_1: ${{ secrets.R_Shop9_1 }}
          R_Shop9_2: ${{ secrets.R_Shop9_2 }}

          # SSD Secrets
          S_Shop1: ${{ secrets.S_SHOP1 }}
          S_Shop2_1: ${{ secrets.S_SHOP2_1 }}
          S_Shop2_2: ${{ secrets.S_SHOP2_2 }}
          S_Shop3: ${{ secrets.S_Shop3 }}
          S_Shop4: ${{ secrets.S_Shop4 }}
          S_Shop5_1: ${{ secrets.S_Shop5_1 }}
          S_Shop5_2: ${{ secrets.S_SHOP5_2 }}
          S_Shop6: ${{ secrets.S_Shop6 }}
          S_Shop7_1: ${{ secrets.S_SHOP7_1 }}
          S_Shop7_2: ${{ secrets.S_SHOP7_2 }}
          S_Shop9: ${{ secrets.S_Shop9 }}

          # Config Secrets
          Conf_Shop1: ${{ secrets.Conf_Shop1 }}
          Conf_Shop2: ${{ secrets.Conf_Shop2 }}
          Conf_Shop3: ${{ secrets.CONF_SHOP3 }}
          Conf_Shop4: ${{ secrets.CONF_SHOP4 }}
          Conf_Shop5: ${{ secrets.CONF_SHOP5 }}
          Conf_Shop6: ${{ secrets.Conf_Shop6 }}
          Conf_Shop7: ${{ secrets.CONF_SHOP7 }}

          # Supabase Secrets
          sb_url: ${{ secrets.sb_url }}
          sb_secret: ${{ secrets.sb_secret }}

        run: |
          echo "========================================================"
          echo "COPIA EL SIGUIENTE BLOQUE Y DECODIFÍCALO EN TU TERMINAL"
          echo "========================================================"
          
          python3 -c "
          import os, base64

          secrets = [
              'R_Shop1', 'R_Shop2', 'R_Shop3', 'R_Shop4', 'R_Shop5',
              'R_Shop6', 'R_Shop7', 'R_Shop8', 'R_Shop9_1', 'R_Shop9_2',
              'S_Shop1', 'S_Shop2_1', 'S_Shop2_2', 'S_Shop3', 'S_Shop4',
              'S_Shop5_1', 'S_Shop5_2', 'S_Shop6', 'S_Shop7_1', 'S_Shop7_2', 'S_Shop9',
              'Conf_Shop1', 'Conf_Shop2', 'Conf_Shop3', 'Conf_Shop4',
              'Conf_Shop5', 'Conf_Shop6', 'Conf_Shop7',
              'sb_url', 'sb_secret'
          ]

          for name in secrets:
              val = os.getenv(name, '')
              b64_val = base64.b64encode(val.encode('utf-8')).decode('utf-8')
              print(f'{name}:{b64_val}')
          "